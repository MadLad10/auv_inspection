# The tests and the ci benchmark gate, and the container image, on every push to main and every pull
# request. The ci suite's scores (benchmark.json, per-hull results and reports) are kept as a build
# artifact.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-and-gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      MUJOCO_GL: egl            # headless rendering: Mesa's software EGL device on a runner without a GPU
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Mesa EGL for headless rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libegl-mesa0 libgl1-mesa-dri

      - name: Install with the pinned versions
        run: |
          python -m pip install uv==0.13.1
          uv venv .venv --python "$(which python)"
          uv pip install --python .venv/bin/python -c constraints.txt -e ".[dev]"

      - name: Tests
        run: .venv/bin/python -m pytest -q

      - name: Fly the ci suite
        run: .venv/bin/auvinspect benchmark run --suite ci --out runs/bench/ci

      - name: Gate on the ci suite's scores
        run: .venv/bin/auvinspect benchmark gate --suite ci --out runs/bench/ci

      - name: Alert rules on the ci missions
        run: for d in runs/bench/ci/*/mission; do .venv/bin/auvinspect health --run "$d"; done

      - name: Keep the scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-ci
          path: |
            runs/bench/ci/benchmark.json
            runs/bench/ci/metrics.prom
            runs/bench/ci/*/result.json
            runs/bench/ci/*/trace.jsonl
            runs/bench/ci/*/report/
            runs/bench/ci/*/mission/events.jsonl
            runs/bench/ci/*/mission/metrics.prom
          if-no-files-found: ignore

  container:
    # The image builds (the navigation package from its repository at the pinned commit) and renders
    # headless: a small hull generated and surveyed inside it, run as its non-root user.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t auvinspect .

      - name: Generate and survey a small hull inside it
        run: |
          mkdir -p smoke && chmod 777 smoke
          printf 'hull: {length_m: 6.0}\n' > smoke/small.yaml
          docker run --rm -v "$PWD/smoke:/work/smoke" auvinspect generate --seed 3 --config smoke/small.yaml --out smoke/s3
          docker run --rm -v "$PWD/smoke:/work/smoke" auvinspect survey --scenario smoke/s3 --no-frames --out smoke/s3/survey
          python3 -c "import json; c = json.load(open('smoke/s3/survey/coverage.json')); print(c['coverage_fraction']); assert c['coverage_fraction'] > 0.99"
