[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auvinspect"
version = "0.2.0"
description = "Simulation-tested underwater hull inspection: scenarios with exact defect ground truth, survey planning, vehicle-in-the-loop missions, coverage scoring."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Yaad Kamrul Bari", email = "yaadbari21@gmail.com"}]
dependencies = [
    "mujoco>=3.3,<4",
    "numpy>=1.24,<2",
    "PyYAML>=6,<7",
    "Pillow>=10,<12",
    "scipy>=1.11,<1.15",
    "auv-navigation-fusion>=0.1,<0.2",
]

# The sibling package is not on PyPI: install it from its locally built wheel, never by name from an
# index (a same-named index package would be someone else's code).
[tool.uv.sources]
auv-navigation-fusion = { path = "../auv_navigation_fusion/dist/auv_navigation_fusion-0.1.0-py3-none-any.whl" }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

# CPU-only PyTorch builds (the PyPI builds bundle about 3 GB of GPU libraries this project does not use)
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.optional-dependencies]
dev = ["pytest>=7.4,<8"]
learn = ["torch>=2.4,<3", "torchvision>=0.19,<1"]   # learned detectors (CPU builds, see the pytorch-cpu index)

[project.scripts]
auvinspect = "auvinspect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auvinspect = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
